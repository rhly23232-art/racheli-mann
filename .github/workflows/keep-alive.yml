# Keeps the free Supabase project awake: Supabase pauses a free project after
# a week with no requests. Runs every three days. Once a month it also writes
# a one-line date file, because GitHub turns off scheduled runs in a repository
# that has had no commits for 60 days.
name: Keep database awake
on:
  schedule:
    - cron: '23 7 */3 * *'
    - cron: '41 6 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          SB_URL: https://pvsdgvzdjcgyydvkkcea.supabase.co
          SB_KEY: sb_publishable_cyIbOLIgj9SCiWAXtNoTgQ_MvdmZbUZ
        run: |
          curl -fsS "$SB_URL/rest/v1/faq?select=id&limit=1" -H "apikey: $SB_KEY" -o /dev/null
          echo "database is awake"
      - name: Check out (monthly)
        if: github.event.schedule == '41 6 1 * *'
        uses: actions/checkout@v4
      - name: Monthly date file (keeps the schedule enabled)
        if: github.event.schedule == '41 6 1 * *'
        run: |
          date -u +%Y-%m-%d > .github/last-ping
          git config user.name "keep-alive"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-ping
          git commit -m "Keep-alive: monthly date file" && git push
